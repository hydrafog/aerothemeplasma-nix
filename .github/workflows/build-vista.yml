name: Build VistaThemePlasma cache

on:
  workflow_dispatch:
  push:
    branches:
      - vista-support-6.7
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/vistathemeplasma/**"
      - ".github/workflows/build-vista.yml"

permissions:
  contents: read

env:
  # Must match the nixpkgs revision used by the dotfiles that consume this
  # branch, otherwise the produced store paths cannot be substituted locally.
  NIXPKGS_REV: 279b4a8275f032c566576b3f181fa0f27197f588

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build VistaThemePlasma
        run: |
          set -o pipefail
          nix build --no-link --print-build-logs \
            --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV" \
            .#packages.x86_64-linux.vistathemeplasma \
            .#packages.x86_64-linux.vistathemeplasma-icons \
            .#packages.x86_64-linux.vistathemeplasma-cursors \
            .#packages.x86_64-linux.vistathemeplasma-sounds \
            2>&1 | tee build.log

      - name: Publish build failure summary
        if: failure()
        run: |
          {
            echo '### Vista build log tail'
            echo '```'
            tail -200 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create portable binary cache
        run: |
          mkdir -p binary-cache
          nix path-info --json \
            --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV" \
            .#packages.x86_64-linux.vistathemeplasma \
            .#packages.x86_64-linux.vistathemeplasma-icons \
            .#packages.x86_64-linux.vistathemeplasma-cursors \
            .#packages.x86_64-linux.vistathemeplasma-sounds \
            > packages.json
          jq -r '.[].path' packages.json > paths.clean
          test -s paths.clean
          xargs -r nix copy --no-recursive --to "file://$PWD/binary-cache" < paths.clean
          cp packages.json binary-cache/paths.json
          test -f binary-cache/nix-cache-info
          du -sh binary-cache

      - name: Upload binary cache
        uses: actions/upload-artifact@v7
        with:
          name: vista-nix-cache
          path: binary-cache
          if-no-files-found: error
          retention-days: 7
