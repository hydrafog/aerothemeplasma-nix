name: Build VistaThemePlasma cache

on:
  workflow_dispatch:
  push:
    branches:
      - vista-support-6.7
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/vistathemeplasma/**"
      - ".github/workflows/build-vista.yml"

permissions:
  contents: write

env:
  # Must match the nixpkgs revision used by the dotfiles that consume this
  # branch, otherwise the produced store paths cannot be substituted locally.
  NIXPKGS_REV: 304568616a94eee17b5b3343f699db8ea1cfb36f

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build and export VistaThemePlasma
        run: |
          set -euo pipefail
          free -h || true
          df -h || true
          nix build --max-jobs 2 --cores 2 --no-link --print-out-paths \
            --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV" \
            .#packages.x86_64-linux.vistathemeplasma \
            .#packages.x86_64-linux.vistathemeplasma-icons \
            .#packages.x86_64-linux.vistathemeplasma-cursors \
            .#packages.x86_64-linux.vistathemeplasma-sounds \
            .#packages.x86_64-linux.vistathemeplasma-x11-session \
            .#packages.x86_64-linux.wmptoolbar \
            > paths.txt 2> build.log
          mapfile -t paths < paths.txt
          test "${#paths[@]}" -gt 0
          nix-store --export "${paths[@]}" > vista-store.export
          ls -lh vista-store.export

      - name: Upload store export
        uses: actions/upload-artifact@v7
        with:
          name: vista-store
          path: |
            vista-store.export
            paths.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vista-cache --cleanup-tag --yes || true
          gh release create vista-cache vista-store.export \
            --title "VistaThemePlasma build cache" \
            --notes "VistaThemePlasma packages built from ${GITHUB_SHA} with nixpkgs ${NIXPKGS_REV}."

      - name: Publish build failure summary
        if: failure()
        run: |
          {
            echo '### Vista build log tail'
            echo '```'
            tail -200 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -inE 'error|fatal|killed|oom|no space|failed|out of memory' build.log | tail -15 | sed 's/%/%25/g' | sed 's/\r$//' | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          tail -15 build.log | sed 's/%/%25/g' | sed 's/\r$//' | while IFS= read -r line; do
            echo "::error::tail: $line"
          done || true
